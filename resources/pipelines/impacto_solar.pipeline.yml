resources:
  pipelines:
    impacto_solar_q3:
      name: TMT_TMTB_Solar_Impacto

      catalog: ${var.output_catalog}
      schema: ${var.output_schema}

      serverless: true
      continuous: false

      configuration:
        project.source_catalog: ${var.source_catalog}
        project.source_schema_950: ${var.source_schema_950}
        project.source_table_950: ${var.source_table_950}
        project.output_catalog: ${var.output_catalog}
        project.output_schema: ${var.output_schema}
        project.periodo_inicio: ${var.periodo_inicio}
        project.periodo_fin: ${var.periodo_fin}
        project.escenario: "ADOPCION_100"

      libraries:
        - file:
            path: ../../src/q3/perfil_solar_q3.py
        - file:
            path: ../../src/q3/impacto_solar_q3.py
        - file:
            path: ../../src/q3/calidad_impacto_solar.py
