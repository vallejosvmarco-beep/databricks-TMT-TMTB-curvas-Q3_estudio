bundle:
  # Renombrado 2026-11-20 (antes tmt_tmtb_curvas_q3): curvas Q3 + impacto solar/baterias
  # + estudio financiero, solo clientes TMT y TMTB de plata_950_carga.
  name: tmt_tmtb_solar_baterias

include:
  - resources/pipelines/*.yml
  - resources/*.yml

variables:
  source_catalog:
    description: Catalogo donde existe plata_950_carga
    default: workspace

  source_schema_950:
    description: Schema donde existe plata_950_carga
    default: plata_analisis

  source_table_950:
    description: Nombre de la tabla plata 950 existente
    default: plata_950_carga

  output_catalog:
    description: Catalogo de salida
    default: workspace

  output_schema:
    description: Schema de salida para curvas Q3
    default: oro_q3

  periodo_inicio:
    description: Fecha inicial inclusive
    default: "2026-01-01"

  periodo_fin:
    description: Fecha final inclusive
    default: "2026-06-30"

  # warehouse_id se resuelve por nombre mediante el mecanismo `lookup` de DABs.
  # Para usar otro warehouse, sobreescribir en el target correspondiente.
  warehouse_id:
    description: SQL Warehouse utilizado por los dashboards
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  free_dev:
    mode: development
    default: true
    variables:
      # Entorno CNFL: catalogo datosami, esquema unico datos
      # (plata_950_carga la genera el bundle AMI_base_estudio)
      source_catalog: datosami
      source_schema_950: datos
      output_catalog: datosami
      output_schema: datos
      # plata_950_carga tiene 2026-04 a 2026-10 (ventana completa; probado antes con octubre).
      periodo_inicio: "2026-04-01"
      periodo_fin: "2026-10-31"
